<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Failsworth Darts & Crib League Tables</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <div class="eyebrow">LIVE STANDINGS</div>
    <h1>Darts & Crib League Tables</h1>

    <nav class="top-nav" aria-label="Main navigation">
      <a href="fixtures.html">Fixtures</a>
      <a href="index.html" class="active">Tables</a>
    </nav>

    <p id="status">Loading league tables...</p>
  </header>

  <main class="page-wrap">
    <section class="panel">
      <h2>Darts League</h2>
      <div class="table-scroll">
        <table id="darts"></table>
      </div>
    </section>

    <section class="panel">
      <h2>Crib League</h2>
      <div class="table-scroll">
        <table id="crib"></table>
      </div>
    </section>

    <section class="panel">
      <h2>Gallon League</h2>
      <div class="table-scroll">
        <table id="gallon"></table>
      </div>
    </section>
  </main>

  <footer>
    Read-only league information. The source workbook is not shared with visitors.
  </footer>

  <script src="app.js"></script>
</body>
</html>
