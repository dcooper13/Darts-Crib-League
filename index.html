<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Darts & Crib League Tables</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrap">
    <header>
      <p class="eyebrow">LIVE STANDINGS</p>
      <h1>Darts & Crib League Tables</h1>
      <p id="status">Loading latest standings…</p>
    </header>

    <section class="card"><h2>Darts League</h2><div class="table-wrap"><table id="darts"></table></div></section>
    <section class="card"><h2>Crib League</h2><div class="table-wrap"><table id="crib"></table></div></section>
    <section class="card"><h2>Gallon League</h2><div class="table-wrap"><table id="gallon"></table></div></section>

    <footer>Read-only league information. The source workbook is not shared with visitors.</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
