name: Update League Tables

on:
  repository_dispatch:
    types:
      - update-league-tables

permissions:
  contents: write

jobs:
  update-tables:
    runs-on: ubuntu-latest

    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Create tables.json from Power Automate
        env:
          LEAGUE_DATA: ${{ toJson(github.event.client_payload) }}
        run: |
          printf '%s' "$LEAGUE_DATA" > tables.json

      - name: Check JSON is valid
        run: |
          jq empty tables.json

      - name: Commit updated tables
        run: |
          git config user.name "League Table Updater"
          git config user.email "actions@github.com"

          git add tables.json

          if git diff --cached --quiet; then
            echo "No league table changes to publish."
          else
            git commit -m "Update live league tables"
            git push
          fi
